  <g id="text_34">
   <text style="fill: #64748b; font: 8.5px 'DejaVu Sans'" transform="translate(37.74125 447.360523)">Denominator: nominal 50 GB/s per link/direction (1.8 TB/s bidirectional per B200), not the reported 53.125 GB/s raw line rate.</text>
   <text style="fill: #64748b; font: 8.5px 'DejaVu Sans'" transform="translate(37.74125 458.816266)">First rollout through last save/train end. No isolated all-reduce or 1→8-GPU scaling test was performed; missing data is not zero.</text>
  </g>
 </g>
