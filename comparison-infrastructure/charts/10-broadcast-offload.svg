  <g id="text_23">
   <text style="fill: #64748b; font: 8.5px 'DejaVu Sans'" transform="translate(41.9625 433.752523)">Host wall time of driver await calls; not an isolated PCIe or CUDA-copy measurement. Components are sequential.</text>
