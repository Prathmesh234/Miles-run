   <text style="fill: #64748b; font: 10.5px 'DejaVu Sans'; text-anchor: start" x="41.9625" y="40.234359" transform="rotate(-0 41.9625 40.234359)">Async PPO · restore actor residency, publish to rollout engines, then offload actor</text>
